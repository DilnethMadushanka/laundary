      machine.scale.setScalar(M.s);
      machine.rotation.set(M.rx + mouse.sy * 0.08, M.ry + mouse.sx * 0.18, M.rz + Math.sin(t * 0.9) * 0.015 * motion);
      drumA += dt * (1.4 + vel * 0.06) * (reduced ? 0.25 : 1);
      rotor.rotation.z = -drumA;
      const tilt = Math.sin(t * 1.7) * 0.16 * motion + clamp((SITE.velocity() || 0) * 0.004, -0.15, 0.15);
      waterMats.forEach(m => { m.uniforms.uTime.value = t * motion; m.uniforms.uTilt.value = tilt; });
      tumble.forEach((m, i) => {
        const a = -drumA * 0.85 + i * 1.7;
        const r = 0.36 + Math.sin(t * 2 + i) * 0.06;
        m.position.x = Math.cos(a) * r; m.position.y = HY + Math.min(Math.sin(a) * r, 0.25) - 0.05;
        m.rotation.set(t * 1.3 + i, t * 0.9 + i * 2, a);
      });
      btnMat.color.copy(glow).multiplyScalar(2.5);
      // door bubbles
      const emit = (sp > 0 && P.statement < 0.4) ? 1 : 0.3;
      mbData.forEach((b, i) => {
        b.life += dt * motion;
        if (b.life > b.max) { spawnMB(b); b.on = Math.random() < emit; }
        b.v.y += dt * 0.12; b.p.addScaledVector(b.v, dt * motion);
        const lifeK = b.life / b.max;
        const s = b.on ? b.s * Math.min(1, lifeK * 5) * (1 - remap(lifeK, 0.85, 1)) : 0;
        mtx.makeScale(s, s, s).setPosition(b.p.x + Math.sin(t * 2 + i) * 0.05, b.p.y, b.p.z);
        mBubbles.setMatrixAt(i, mtx);
      });
      mBubbles.instanceMatrix.needsUpdate = true;
    }

    // ---- FOLDED CLOTHES ----
    const cv = (sp > 0 ? 1 : remap(P.hero, 0.7, 1)) * (1 - remap(P.statement, 0.04, 0.22));
    clothes.visible = cv > 0.01 && visible;
    if (clothes.visible) {
      clothItems.forEach((c, i) => {
        const k = ease(remap(sp, 0.1 + i * 0.16, 0.24 + i * 0.16));
        const a = (i / 5) * Math.PI * 2 + t * 0.35 * motion;
        const ox = M.x + Math.cos(a) * 2.1 * M.s, oy = M.y + 0.3 * M.s + Math.sin(a * 2 + i) * 0.45 * M.s, oz = M.z + Math.sin(a) * 1.5 * M.s;
        const sx = M.x + 1.5 * M.s, sy = M.y - 1.2 * M.s + i * 0.19 * M.s, sz = M.z + 1.15 * M.s;
        c.position.set(lerp(ox, sx, k), lerp(oy, sy, k), lerp(oz, sz, k));
        c.rotation.set(lerp(Math.sin(t * 0.8 + i) * 0.9, 0, k), lerp(t * 0.5 + i, 0.3 + (i % 2) * 0.12, k), lerp(Math.cos(t * 0.6 + i) * 0.5, 0, k));
        c.scale.setScalar(M.s * 0.7 * cv);
      });
    }

    // ---- STATEMENT TEXT ----
    const tp = P.statement;
    const textOp = remap(tp, 0.04, 0.24) * (1 - remap(tp, 0.62, 0.86));
    if (textRows.length) {
      const dist = CAM.z - textRows[0].position.z;
      const hw = dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * aspect;
      textRows.forEach((m, i) => {
        m.visible = textOp > 0.001;
        if (!m.visible) return;
        const w = 2 * hw * (small ? 2.6 : 1.3), h = w * m.userData.ratio;

        m.position.y = (i === 0 ? 0.5 : -0.5) * h * 1.02 + dir * (tp - 0.5) * 0.8;
        m.material.opacity = textOp * (i === 0 ? 0.95 : 0.8);
      });
    }

    // ---- AMBIENT BUBBLES ----
    bubbleMat.uniforms.uTime.value = t;
    const scrollDrift = (SITE.velocity() || 0) * 0.004;
    for (let i = 0; i < bubbles.count; i++) {
      const b = bData[i];
      b.y += (b.sp * dt * motion) - scrollDrift * dt * 0.5;
      if (b.y > 1.15) { b.y = -1.15; b.u = Math.random() * 2 - 1; }
      if (b.y < -1.2) b.y = 1.12;
      const dz = CAM.z - b.z, hh = dz * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), hw = hh * aspect;
      const x = b.u * hw * 1.05 + Math.sin(t * b.w + b.ph) * 0.25 * motion;
      const y = b.y * hh * 1.1 + CAM.y;
      const s = b.s * (b.z > 1.5 ? 0.6 : 1) * (small ? 0.8 : 1);
      mtx.makeScale(s, s, s).setPosition(x, y, b.z);
      bubbles.setMatrixAt(i, mtx);
    }
    bubbles.instanceMatrix.needsUpdate = true;

    // ---- glow centre follows the focal object ----
    if (heroVis > 0.5) tmpV.set(0, (PED_TOP + 0.9) * hero.scale.y + hero.position.y, 0);
    else if (SITE.active === 'pricing' || SITE.active === 'how' || SITE.active === 'faq') tmpV.set(0, 0.3, 0);
    else tmpV.set(M.x, M.y, M.z);
    tmpV.project(camera);
    const cu = bgMat.uniforms.uCenter.value;
    cu.x = damp(cu.x, tmpV.x * 0.5 + 0.5, 3, dt); cu.y = damp(cu.y, clamp(tmpV.y * 0.5 + 0.5, 0.1, 0.9), 3, dt);

    // ---- camera parallax ----
    camera.position.set(CAM.x + mouse.sx * 0.35 * motion, CAM.y - mouse.sy * 0.2 * motion, CAM.z);
    camera.lookAt(0, 0, 0);

    composer.render();
  }

  // compile shaders with everything visible, then start the loop
  SITE.loader.set(84); await yieldFrame();
  if (renderer.compileAsync) await renderer.compileAsync(scene, camera); else renderer.compile(scene, camera);
  SITE.loader.set(92); await yieldFrame();
  frame();                       // first full render (also warms the bloom + reflection targets)
  await yieldFrame();
  frame();
  SITE.loader.set(100);

  // ---------- adaptive quality: if the device can't keep ~45fps, step quality down ----------
  let quality = 0, avg = 16.7, lastT = 0, frames = 0, lastCheck = 0;
  function degrade() {
    quality++;
    if (quality === 1) { reflectOn = false; pixelRatio = Math.min(pixelRatio, 1.25); }
    else if (quality === 2) { pixelRatio = 1; bubbles.count = Math.floor(BCOUNT * 0.6); }
    else if (quality === 3) { bloom.enabled = false; pixelRatio = Math.min(1, devicePixelRatio) * 0.85; }
    renderer.setPixelRatio(pixelRatio); composer.setPixelRatio(pixelRatio);
  }
  function watchFps(now) {
    if (lastT) avg = avg * 0.92 + Math.min(now - lastT, 100) * 0.08;
    lastT = now; frames++;
    if (frames > 90 && now - lastCheck > 1500 && quality < 3 && document.documentElement.classList.contains('loaded')) {
      lastCheck = now;
      if (avg > 22) degrade();
    }
  }

  let raf = 0;
  const loop = (now) => { raf = requestAnimationFrame(loop); if (now) watchFps(now); frame(); };
  loop();
  document.addEventListener('visibilitychange', () => {
    cancelAnimationFrame(raf);
    if (!document.hidden) { clock.getDelta(); lastT = 0; loop(); }
  });
}

main().catch(err => {
  console.error('[3D] disabled:', err);
  document.documentElement.classList.add('no-webgl');
  SITE.loader.set(100);
});
</script>
